<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/src/public/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

    <title>SleepWellfit - WDD330 Aldana Andrea Portugal Pickling</title>

    <meta name="description"
      content="Sleep Well Fit helps you track sleep, discover healthy recipes, and find exercises for a healthier lifestyle." />
    <meta name="author" content="Aldana Andrea Portugal Pickling">


      <link rel="preconnect" href="https://fonts.googleapis.com" />
      <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
      <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Roboto:wght@400;500;700&display=swap"
        rel="stylesheet" />
      
    
      <link rel="stylesheet" href="/src/css/styles.css" />
      <script type="module" src="src/js/app.js"></script>


   
  </head>


  <body>

  <body>
    
    <header class="site-header">
      <nav class="navbar" aria-label="Main navigation">
        <a href="#home" class="logo" data-section="home" aria-label="Sleep Well Fit home">
          <span class="logo-icon" aria-hidden="true">☾</span>
          <span>SLEEP WELL FIT</span>
        </a>
  
        <button type="button" class="menu-toggle" aria-label="Open navigation menu" aria-expanded="false"
          aria-controls="main-navigation">
          <span aria-hidden="true">☰</span>
        </button>
  
        <ul id="main-navigation" class="navigation-list">
          <li>
            <a href="#home" class="nav-link active" data-section="home">
              Home
            </a>
          </li>
  
          <li>
            <a href="#sleep" class="nav-link" data-section="sleep">
              Sleep
            </a>
          </li>
  
          <li>
            <a href="#nutrition" class="nav-link" data-section="nutrition">
              Nutrition
            </a>
          </li>
  
          <li>
            <a href="#fitness" class="nav-link" data-section="fitness">
              Fitness
            </a>
          </li>
        </ul>
      </nav>
    </header>
  
    <main id="main-content">
  
      <!-- HOME -->
      <section id="home" class="page-section active-section" aria-labelledby="home-title">
        <div class="home-container">
      
          <header class="section-header home-header" id="home-header">
            <!-- JavaScript loads home content from data.json -->
          </header>
      
          <div class="home-cards" id="home-cards">
            <!-- JavaScript loads home cards from data.json -->
          </div>
      
          <div class="home-cta" id="home-cta">
            <!-- JavaScript loads CTA from data.json -->
          </div>
      
        </div>
      </section>
      
      
      <!-- SLEEP -->
      <section id="sleep" class="page-section" aria-labelledby="sleep-title" hidden>
        <div class="page-container">
      
          <header class="section-header" id="sleep-header">
            <!-- JavaScript loads sleep header from data.json -->
          </header>
      
          <section class="sleep-calculator" aria-labelledby="sleep-calculator-title">
      
            <h2 id="sleep-calculator-title"></h2>
      
            <form id="sleep-form">
      
              <div class="form-group">
                <label for="bedtime" id="bedtime-label"></label>
      
                <input type="time" id="bedtime" name="bedtime" required aria-required="true" />
              </div>
      
              <div class="form-group">
                <label for="wake-time" id="wake-time-label"></label>
      
                <input type="time" id="wake-time" name="wakeTime" required aria-required="true" />
              </div>
      
              <button type="submit" class="primary-button" id="calculate-sleep"></button>
      
            </form>
      
            <div id="sleep-result" class="sleep-result" aria-live="polite" aria-atomic="true">
              <div class="result-icon" aria-hidden="true">
                ☾
              </div>
      
              <p class="result-label" id="sleep-result-label"></p>
      
              <p id="sleep-hours" class="result-value">
                -- hours
              </p>
            </div>
      
            <button type="button" id="save-sleep" class="secondary-button" disabled></button>
      
          </section>
      
      
          <section class="sleep-history" aria-labelledby="sleep-history-title">
      
            <header class="history-header">
      
              <div class="section-heading-icon" aria-hidden="true">
                ☷
              </div>
      
              <div>
                <h2 id="sleep-history-title"></h2>
      
                <p id="sleep-history-description"></p>
              </div>
      
            </header>
      
            <div id="sleep-history-list" class="history-list" aria-live="polite">
              <div class="empty-state">
      
                <div class="empty-state-icon" aria-hidden="true">
                  ☾
                </div>
      
                <p id="sleep-empty-message"></p>
      
              </div>
            </div>
      
            <button type="button" id="clear-history" class="danger-button"></button>
      
          </section>
      
        </div>
      </section>
      
      
      <!-- NUTRITION -->
      <section id="nutrition" class="page-section" aria-labelledby="nutrition-title" hidden>
        <div class="page-container">
      
          <header class="section-header" id="nutrition-header">
            <!-- JavaScript loads nutrition header from data.json -->
          </header>
      
          <section class="recipe-search" aria-labelledby="recipe-search-title">
      
            <h2 id="recipe-search-title" class="visually-hidden">
              Search recipes
            </h2>
      
            <form id="recipe-search-form">
      
              <div class="search-group">
      
                <label for="recipe-search" class="visually-hidden">
                  Search for a recipe
                </label>
      
                <input type="search" id="recipe-search" name="recipe" autocomplete="off" />
      
                <button type="submit" class="primary-button" id="recipe-search-button"></button>
      
              </div>
      
            </form>
      
          </section>
      
      
          <section class="recipe-results" aria-labelledby="recipe-results-title">
      
            <header class="content-header">
              <h2 id="recipe-results-title"></h2>
            </header>
      
            <div id="recipe-list" class="recipe-grid" aria-live="polite"></div>
      
          </section>
      
      
          <section class="favorite-recipes" aria-labelledby="favorite-recipes-title">
      
            <header class="content-header">
      
              <div class="content-heading">
      
                <!--<span aria-hidden="true">♡</span>-->
      
                <h2 id="favorite-recipes-title"></h2>
      
              </div>
      
              <p id="favorite-recipes-description"></p>
      
            </header>
      
            <div id="favorite-list" class="recipe-grid" aria-live="polite"></div>
      
          </section>
      
        </div>
      </section>
      
      
      <!-- FITNESS -->
      <section id="fitness" class="page-section" aria-labelledby="fitness-title" hidden>
        <div class="page-container">
      
          <header class="section-header" id="fitness-header">
            <!-- JavaScript loads fitness header from data.json -->
          </header>
      
      
          <section class="exercise-filters" aria-labelledby="exercise-filter-title">
      
            <h2 id="exercise-filter-title"></h2>
      
            <div class="filter-buttons" role="group" aria-label="Filter exercises by body part" id="fitness-filter-buttons">
              <!-- JavaScript loads filter buttons from data.json -->
            </div>
      
          </section>
      
      
          <section class="exercise-results" aria-labelledby="exercise-results-title">
      
            <header class="content-header">
              <h2 id="exercise-results-title"></h2>
            </header>
      
            <div id="exercise-list" class="exercise-list" aria-live="polite"></div>
      
          </section>
      
        </div>
      </section>
      
      </main>
      
      
      <!-- RECIPE MODAL -->
      <dialog id="recipe-modal" class="modal" aria-labelledby="recipe-modal-title">
      
        <div class="modal-content">
      
          <header class="modal-header">
      
            <h2 id="recipe-modal-title">
              Recipe Details
            </h2>
      
            <button type="button" class="modal-close" id="recipe-modal-close" aria-label="Close recipe details">
              ×
            </button>
      
          </header>
      
          <div id="recipe-modal-body">
            <!-- JavaScript inserts recipe details here -->
          </div>
      
        </div>
      
      </dialog>
      
      
      <!-- EXERCISE MODAL -->
      <dialog id="exercise-modal" class="modal" aria-labelledby="exercise-modal-title">
      
        <div class="modal-content">
      
          <header class="modal-header">
      
            <h2 id="exercise-modal-title">
              Exercise Details
            </h2>
      
            <button type="button" class="modal-close" id="exercise-modal-close" aria-label="Close exercise details">
              ×
            </button>
      
          </header>
      
          <div id="exercise-modal-body">
            <!-- JavaScript inserts exercise details here -->
          </div>
      
        </div>
      
      </dialog>
      
      
      <footer class="site-footer">
      
        <p>
          &copy;
          <span id="currentyear"></span>
          Sleep Well Fit | Aldana Andrea Portugal Pickling.
        </p>
      
        <div class="social-links" aria-label="Social media links">
      
          <a href="https://www.instagram.com/" target="_blank" aria-label="Instagram">
            Instagram
          </a>
      
          <a href="https://www.facebook.com/" target="_blank" aria-label="Facebook">
            Facebook
          </a>
      
          <a href="https://www.whatsapp.com/" target="_blank" aria-label="WhatsApp">
            WhatsApp
          </a>
      
        </div>
      
      </footer>
      
      </body>
      
      </html>
