<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" >

    <link rel="icon" type="image/svg+xml" href="/src/public/favicon.svg" >

    <meta name="viewport" content="width=device-width, initial-scale=1.0" >

    <title>Sleep | SleepWellfit</title>

    <meta name="description" content="Track your sleep and calculate your sleeping hours with Sleep Well Fit." >

    <meta name="author" content="Aldana Andrea Portugal Pickling" >

    <link rel="preconnect" href="https://fonts.googleapis.com" >

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin >

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Roboto:wght@400;500;700&display=swap"
        rel="stylesheet" >

    <link rel="stylesheet" href="/src/css/styles.css" >

    <script type="module" src="/src/js/app.js"></script>
</head>

<body>
    <header id="main-header" class="site-header">
        <nav class="navbar" aria-label="Main navigation">
            <a href="index.html" class="logo" data-section="home" aria-label="Sleep Well Fit home">
                <span class="logo-icon" aria-hidden="true">☾</span>
                <span>SLEEP WELL FIT</span>
            </a>

            <button type="button" class="menu-toggle" aria-label="Open navigation menu" aria-expanded="false"
                aria-controls="main-navigation">
                <span aria-hidden="true">☰</span>
            </button>

            <ul id="main-navigation" class="navigation-list">
                <li>
                    <a href="index.html" class="nav-link active" data-section="home">
                        Home
                    </a>
                </li>

                <li>
                    <a href="sleep.html" class="nav-link" data-section="sleep">
                        Sleep
                    </a>
                </li>

                <li>
                    <a href="nutrition.html" class="nav-link" data-section="nutrition">
                        Nutrition
                    </a>
                </li>

                <li>
                    <a href="fitness.html" class="nav-link" data-section="fitness">
                        Fitness
                    </a>
                </li>
            </ul>
        </nav>
    </header>

    <main id="main-content">
        <!-- SLEEP -->
        <section id="sleep" class="page-section active-section" aria-labelledby="sleep-title">
            <div class="page-container">
                <header class="section-header" id="sleep-header">

                    <h1 id="sleep-title">Sleep</h1>
                    <!-- JavaScript loads sleep header from data.json -->
                </header>

                <section class="sleep-calculator" aria-labelledby="sleep-calculator-title">
                    <h2 id="sleep-calculator-title">Sleep Calculator</h2>

                    <form id="sleep-form">
                        <div class="form-group">
                            <label for="bedtime" id="bedtime-label">Bedtime</label>

                            <input type="time" id="bedtime" name="bedtime" required >
                        </div>

                        <div class="form-group">
                            <label for="wake-time" id="wake-time-label">Wake time</label>

                            <input type="time" id="wake-time" name="wakeTime" required >
                        </div>

                        <button type="submit" class="primary-button" id="calculate-sleep" aria-label="Calculate">Calculate</button>
                    </form>

                    <div id="sleep-result" class="sleep-result" aria-live="polite" aria-atomic="true">
                        <div class="result-icon" aria-hidden="true">☾</div>

                        <p class="result-label" id="sleep-result-label"></p>

                        <p id="sleep-hours" class="result-value">-- hours</p>
                    </div>

                    <button type="button" id="save-sleep" class="secondary-button" disabled aria-label="Save sleep record">Save</button>
                </section>

                <section class="sleep-history" aria-labelledby="sleep-history-title">
                    <header class="history-header">
                        <div class="section-heading-icon" aria-hidden="true">☷</div>

                        <div>
                            <h2 id="sleep-history-title">Sleep History</h2>

                            <p id="sleep-history-description"></p>
                        </div>
                    </header>

                    <div id="sleep-history-list" class="history-list" aria-live="polite">
                        <div class="empty-state">
                            <div class="empty-state-icon" aria-hidden="true">☾</div>

                            <p id="sleep-empty-message"></p>
                        </div>
                    </div>

                    <button type="button" id="clear-history" class="danger-button" aria-label="Clear sleep history">Clear history</button>
                </section>
            </div>
        </section>
    </main>

    <footer id="main-footer" class="site-footer">
        <p>
            &copy;
            <span id="currentyear"></span>
            Sleep Well Fit | Aldana Andrea Portugal Pickling.
        </p>

    <nav class="social-links" aria-label="Social media links">
        <a href="https://github.com/" target="_blank" aria-label="Git Hub">
            GitHub
        </a>
    
        <a href="https://www.facebook.com/" target="_blank" aria-label="LinkedIn">
            Facebook
        </a>
    
        <a href="https://www.whatsapp.com/" target="_blank" aria-label="WhatsApp">
            WhatsApp
        </a>
    </nav>
    </footer>
</body>

</html>
