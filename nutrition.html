<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" >

    <link rel="icon" type="image/svg+xml" href="/src/public/favicon.svg" >

    <meta name="viewport" content="width=device-width, initial-scale=1.0" >

    <title>Nutrition | SleepWellfit</title>

    <meta name="description" content="Discover healthy recipes with Sleep Well Fit." >

    <meta name="author" content="Aldana Andrea Portugal Pickling">

    <link rel="preconnect" href="https://fonts.googleapis.com" >

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin >

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Roboto:wght@400;500;700&display=swap"
        rel="stylesheet" >

    <link rel="stylesheet" href="/src/css/styles.css" >

    <script type="module" src="/src/js/app.js"></script>
</head>

<body>
    <header id="main-header" class="site-header">
        <nav class="navbar" aria-label="Main navigation">
            <a href="index.html" class="logo" data-section="home" aria-label="Sleep Well Fit home">
                <span class="logo-icon" aria-hidden="true">☾</span>
                <span>SLEEP WELL FIT</span>
            </a>

            <button type="button" class="menu-toggle" aria-label="Open navigation menu" aria-expanded="false"
                aria-controls="main-navigation">
                <span aria-hidden="true">☰</span>
            </button>

            <ul id="main-navigation" class="navigation-list">
                <li>
                    <a href="index.html" class="nav-link active" data-section="home">
                        Home
                    </a>
                </li>

                <li>
                    <a href="sleep.html" class="nav-link" data-section="sleep">
                        Sleep
                    </a>
                </li>

                <li>
                    <a href="nutrition.html" class="nav-link" data-section="nutrition">
                        Nutrition
                    </a>
                </li>

                <li>
                    <a href="fitness.html" class="nav-link" data-section="fitness">
                        Fitness
                    </a>
                </li>
            </ul>
        </nav>
    </header>

    <main id="main-content">
        <section id="nutrition" class="page-section active-section" aria-labelledby="nutrition-title">
            <div class="page-container">
                <header class="section-header" id="nutrition-header"></header>

                <section class="recipe-search" aria-labelledby="recipe-search-title">
                    <h2 id="recipe-search-title" class="visually-hidden">
                        Search recipes
                    </h2>

                    <form id="recipe-search-form">
                        <div class="search-group">
                            <label for="recipe-search" class="visually-hidden">
                                Search for a recipe
                            </label>

                            <input type="search" id="recipe-search" name="recipe" autocomplete="off" >

                            <button type="submit" class="primary-button" id="recipe-search-button"></button>
                        </div>
                    </form>
                </section>

                <section class="recipe-results" aria-labelledby="recipe-results-title">
                    <header class="content-header">
                        <h2 id="recipe-results-title">Recipe Results</h2>
                    </header>

                    <div id="recipe-list" class="recipe-grid" aria-live="polite"></div>
                </section>

                <section class="favorite-recipes" aria-labelledby="favorite-recipes-title">
                    <header class="content-header">
                        <div class="content-heading"></div>

                        <h2 id="favorite-recipes-title">Favorite Recipes</h2>

                        <p id="favorite-recipes-description"></p>
                    </header>

                    <div id="favorite-list" class="recipe-grid" aria-live="polite"></div>
                </section>
            </div>
        </section>
    </main>

    <dialog id="recipe-modal" class="modal" aria-labelledby="recipe-modal-title">
        <div class="modal-content">
            <header class="modal-header">
                <h2 id="recipe-modal-title">Recipe Details</h2>

                <button type="button" class="modal-close" id="recipe-modal-close" aria-label="Close recipe details">
                    ×
                </button>
            </header>

            <div id="recipe-modal-body">
                
            </div>
        </div>
    </dialog>

    <footer id="main-footer" class="site-footer">
        <p>
            &copy;
            <span id="currentyear"></span>
            Sleep Well Fit | Aldana Andrea Portugal Pickling.
        </p>

        <nav class="social-links" aria-label="Social media links">
            <a href="https://www.instagram.com/" target="_blank" aria-label="Instagram">
                Instagram
            </a>

            <a href="https://www.facebook.com/" target="_blank" aria-label="Facebook">
                Facebook
            </a>

            <a href="https://www.whatsapp.com/" target="_blank" aria-label="WhatsApp">
                WhatsApp
            </a>
        </nav>
    </footer>
</body>

</html>
